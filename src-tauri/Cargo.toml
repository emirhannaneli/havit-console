[package]
name = "havit-console"
version = "0.2.0"
description = "Open-source unified hardware configuration console for Havit peripherals"
authors = ["Havit Console Community"]
edition = "2021"
license = "MIT"

[lib]
name = "havit_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
gif = "0.13"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_Memory",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

# Image decoding/scaling is very slow unoptimized; optimize dependencies in dev builds too.
[profile.dev.package."*"]
opt-level = 3
