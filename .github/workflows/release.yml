name: Release

# Semantic versioning and publishing, driven by Conventional Commits on `main`:
#
#   1. `release-please` reads the commits since the last release, decides the next
#      version (fix: → patch, feat: → minor, `!`/BREAKING CHANGE → major), and keeps a
#      release PR up to date that bumps package.json, src-tauri/tauri.conf.json and
#      src-tauri/Cargo.toml and writes CHANGELOG.md.
#   2. Merging that PR creates the tag `vX.Y.Z` and a GitHub Release.
#   3. The `build` job then compiles the Windows installer, signs the updater bundle and
#      uploads it plus `latest.json` to that release. Installed apps pick it up from
#      https://github.com/emirhannaneli/havit-console/releases/latest/download/latest.json
#
# Third-party actions are pinned to commit SHAs (the comment is the tag they came from);
# Dependabot bumps them via .github/dependabot.yml.
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          contents of ~/.tauri/havit-console.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD key password (empty string if the key has none)

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release-please.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # The bundler downloads NSIS from GitHub at build time; that download fails now and then.
          retryAttempts: 3
